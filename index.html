<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesagem dos Porquinhos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <h1>🐹 Pesagem dos Porquinhos</h1>
    <div class="toolbar">
      <button class="btn-tool" id="btn-demo" title="Carregar pesagens de exemplo para testar">✨ Dados Demo</button>
      <button class="btn-tool" id="btn-export-csv" title="Exportar histórico para Excel/CSV">📊 CSV</button>
      <button class="btn-tool" id="btn-export-json" title="Baixar backup completo em JSON">💾 Backup</button>
      <button class="btn-tool" id="btn-import-json" title="Restaurar backup de arquivo JSON">📂 Restaurar</button>
      <input type="file" id="input-import-file" accept=".json,application/json" hidden>
      <button class="btn-tool" id="btn-som" title="Ativar/desativar sons dos porquinhos">🔊 Som</button>
      <button class="btn-tool" id="btn-tema" title="Alternar entre modo Dia e Noite">🌙 Noite</button>
    </div>
  </header>

  <div id="cena-wrapper">
    <div id="cena">
      <div class="aviso" id="aviso3d">Carregando a cena 3D…</div>
      <div class="cena-controles">
        <div class="cena-grupo" id="cena-foco-grupo"></div>
      </div>
    </div>
  </div>

  <div class="dica">
    <span>Arraste para girar · Role o mouse para zoom · Toque num porquinho para ele pular ("popcorn")!</span>
  </div>

  <section class="resumo-grid" id="resumo-geral"></section>

  <section class="grafbox">
    <div class="graf-header">
      <h3>📈 Curva de Crescimento</h3>
      <div class="graf-filtros">
        <button class="ativo" data-filtro-dias="0" onclick="window.appAcoes.filtrarPeriodo(0)">Tudo</button>
        <button data-filtro-dias="90" onclick="window.appAcoes.filtrarPeriodo(90)">90 dias</button>
        <button data-filtro-dias="30" onclick="window.appAcoes.filtrarPeriodo(30)">30 dias</button>
      </div>
    </div>
    <canvas id="graf"></canvas>
    <div id="graf-tooltip"></div>
    <div class="legenda" id="legenda"></div>
  </section>

  <main id="app"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/scene3d.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
